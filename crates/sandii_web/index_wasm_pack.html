<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Sandii (Web)</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      background: #111;
      color: #eee;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    #game-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      min-height: 0;
    }
    canvas {
      display: block;
      border: 1px solid #444;
      max-width: 100%;
      height: auto;
      touch-action: none;
      cursor: crosshair;
    }
    #bottom-ui {
      flex-shrink: 0;
      width: 100%;
      padding: 12px 12px 20px;
      border-top: 1px solid #333;
      background: #161616;
    }
    #material-swatches {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(88px, 1fr));
      gap: 8px;
      width: 100%;
      margin-bottom: 10px;
    }
    .mat-btn {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      padding: 0;
      border: 2px solid #444;
      border-radius: 6px;
      background: #1e1e1e;
      color: #eee;
      cursor: pointer;
      overflow: hidden;
      min-height: 52px;
      font: inherit;
    }
    .mat-btn--selected {
      border-color: #fff;
      box-shadow: 0 0 0 1px #fff;
    }
    .mat-btn--ineligible,
    .mat-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .mat-swatch {
      height: 18px;
      width: 100%;
      flex-shrink: 0;
    }
    .mat-name {
      padding: 4px 6px 6px;
      font-size: 11px;
      line-height: 1.2;
      text-align: center;
      word-break: break-word;
    }
    #mode-toggles {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
      width: 100%;
      margin-bottom: 10px;
    }
    .mode-btn {
      padding: 10px 8px;
      border: 2px solid #555;
      border-radius: 6px;
      background: #252525;
      color: #ddd;
      cursor: pointer;
      font: inherit;
      font-size: 14px;
    }
    .mode-btn--active {
      border-color: #8ab4f8;
      background: #2a3550;
      color: #fff;
    }
    .mode-help {
      font-size: 13px;
      color: #b0b0b0;
      margin: 0 0 10px;
      line-height: 1.45;
    }
    #stats { font-size: 13px; color: #aaa; margin-bottom: 8px; }
    .help { font-size: 12px; color: #888; margin: 0; line-height: 1.45; max-width: 60rem; }
  </style>
</head>
<body>
  <div id="game-wrap">
    <canvas id="sandii" width="448" height="252"></canvas>
  </div>
  <footer id="bottom-ui">
    <div id="material-swatches"></div>
    <div id="mode-toggles"></div>
    <p id="mode-help" class="mode-help"></p>
    <div id="stats"></div>
    <p class="help">
      Shortcuts: middle drag or arrows pan; <kbd>[</kbd> <kbd>]</kbd> brush;
      <kbd>C</kbd> clear; <kbd>T</kbd> / <kbd>L</kbd> spawn rigid; <kbd>Shift</kbd>+<kbd>R</kbd> rigid rect; <kbd>Shift</kbd> drag rectangles.
    </p>
  </footer>
  <script type="module">
    import init from './pkg/sandii_web.js';
    await init();
  </script>
</body>
</html>
