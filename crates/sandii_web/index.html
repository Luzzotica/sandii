<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0d1120" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Sandii</title>
    <link data-trunk rel="rust" href="Cargo.toml" data-wasm-opt="0" />
    <style>
      :root {
        --glass: rgba(18, 20, 30, 0.72);
        --glass-strong: rgba(18, 20, 30, 0.88);
        --line: rgba(255, 255, 255, 0.09);
        --line-strong: rgba(255, 255, 255, 0.16);
        --text: #f2f3f7;
        --muted: rgba(242, 243, 247, 0.6);
        --accent: #ffc94d;
        --accent-ink: #1a1405;
        --danger: #ff7a6b;
        --gap: 16px;
        /* Partii's insets first: inside the iPhone app's game frame iOS keeps env() on the
           rotation the page was made in. Set by the script below (?safe= / partii:insets). */
        --sat: var(--partii-safe-top, env(safe-area-inset-top, 0px));
        --sar: var(--partii-safe-right, env(safe-area-inset-right, 0px));
        --sab: var(--partii-safe-bottom, env(safe-area-inset-bottom, 0px));
        --sal: var(--partii-safe-left, env(safe-area-inset-left, 0px));
        --fab: 56px;
        --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        touch-action: none;
        background: #0d1120;
        color: var(--text);
        font: 500 14px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial,
          sans-serif;
      }
      button {
        font: inherit;
        color: inherit;
        border: 0;
        background: none;
        cursor: pointer;
        touch-action: manipulation;
      }
      button:focus-visible,
      input:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      svg {
        display: block;
      }

      /* The world fills the viewport edge to edge; the UI floats over it inside the safe areas. */
      #sandii {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        touch-action: none;
        cursor: crosshair;
        outline: none;
      }

      .glass {
        background: var(--glass);
        -webkit-backdrop-filter: blur(18px) saturate(150%);
        backdrop-filter: blur(18px) saturate(150%);
        border: 1px solid var(--line);
        box-shadow:
          0 10px 30px rgba(0, 0, 0, 0.35),
          inset 0 1px 0 rgba(255, 255, 255, 0.05);
      }

      /* Debug line: ?debug or F3 only. */
      #hud {
        position: fixed;
        top: calc(10px + var(--sat));
        left: calc(10px + var(--sal));
        max-width: calc(100% - 20px - var(--sal) - var(--sar));
        padding: 5px 10px;
        border-radius: 10px;
        font: 11px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: var(--muted);
        pointer-events: none;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        z-index: 5;
      }
      #hud[hidden] {
        display: none;
      }

      /* Quick bar: current tool + recent materials (bottom left). */
      #quick {
        position: fixed;
        left: calc(var(--gap) + var(--sal));
        bottom: calc(var(--gap) + var(--sab));
        height: var(--fab);
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 5px;
        border-radius: 999px;
        z-index: 10;
      }
      #quick .sep {
        width: 1px;
        height: 26px;
        margin: 0 3px;
        background: var(--line-strong);
      }
      .qbtn {
        position: relative;
        width: 44px;
        height: 44px;
        flex: 0 0 auto;
        border-radius: 50%;
        display: grid;
        place-items: center;
        transition:
          transform 0.15s var(--ease),
          background 0.15s;
      }
      .qbtn:active {
        transform: scale(0.92);
      }
      .qmat::before {
        content: "";
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: var(--swatch, #888);
        box-shadow:
          inset 0 0 0 1px rgba(255, 255, 255, 0.22),
          inset 0 -3px 6px rgba(0, 0, 0, 0.25);
        transition: transform 0.15s var(--ease);
      }
      .qmat::after {
        content: "";
        position: absolute;
        inset: 3px;
        border-radius: 50%;
        box-shadow: 0 0 0 2px var(--accent);
        opacity: 0;
        transform: scale(0.85);
        transition:
          opacity 0.15s,
          transform 0.15s var(--ease);
      }
      .qmat.on::after {
        opacity: 1;
        transform: scale(1);
      }
      .qmat[hidden] {
        display: none;
      }
      #quick-tool {
        color: var(--text);
        background: rgba(255, 255, 255, 0.06);
      }
      #quick-tool.on {
        background: var(--accent);
        color: var(--accent-ink);
      }
      .ico {
        width: 22px;
        height: 22px;
      }
      #quick-tool .ico {
        display: none;
      }
      #quick-tool[data-tool="paint"] .i-paint,
      #quick-tool[data-tool="erase"] .i-erase,
      #quick-tool[data-tool="rigid"] .i-rigid,
      #quick-tool[data-tool="blast"] .i-blast,
      #quick-tool[data-tool="heat"] .i-heat,
      #quick-tool[data-tool="cool"] .i-cool {
        display: block;
      }

      /* Menu bubble (bottom right). */
      #menu-btn {
        position: fixed;
        right: calc(var(--gap) + var(--sar));
        bottom: calc(var(--gap) + var(--sab));
        width: var(--fab);
        height: var(--fab);
        border-radius: 50%;
        display: grid;
        place-items: center;
        z-index: 30;
        transition:
          transform 0.18s var(--ease),
          background 0.18s;
      }
      #menu-btn:active {
        transform: scale(0.93);
      }
      #menu-btn .bars,
      #menu-btn .bars::before,
      #menu-btn .bars::after {
        display: block;
        width: 20px;
        height: 2px;
        border-radius: 2px;
        background: currentColor;
        transition:
          transform 0.25s var(--ease),
          opacity 0.2s;
      }
      #menu-btn .bars {
        position: relative;
      }
      #menu-btn .bars::before,
      #menu-btn .bars::after {
        content: "";
        position: absolute;
        left: 0;
      }
      #menu-btn .bars::before {
        top: -6px;
      }
      #menu-btn .bars::after {
        top: 6px;
      }
      body.menu-open #menu-btn {
        background: var(--glass-strong);
      }
      body.menu-open #menu-btn .bars {
        background: transparent;
      }
      body.menu-open #menu-btn .bars::before {
        transform: translateY(6px) rotate(45deg);
      }
      body.menu-open #menu-btn .bars::after {
        transform: translateY(-6px) rotate(-45deg);
      }

      /* Menu sheet: floats above the bubble; beside it on short landscape screens. */
      #scrim {
        position: fixed;
        inset: 0;
        z-index: 20;
        background: rgba(5, 7, 14, 0.25);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.22s;
      }
      body.menu-open #scrim {
        opacity: 1;
        pointer-events: auto;
      }
      #sheet {
        position: fixed;
        z-index: 25;
        right: calc(var(--gap) + var(--sar));
        bottom: calc(var(--gap) + var(--sab) + var(--fab) + 12px);
        width: min(380px, calc(100% - 2 * var(--gap) - var(--sal) - var(--sar)));
        max-height: calc(100% - var(--sat) - var(--sab) - var(--fab) - 2 * var(--gap) - 24px);
        display: flex;
        flex-direction: column;
        border-radius: 22px;
        background: var(--glass-strong);
        transform-origin: calc(100% - 28px) calc(100% + 40px);
        transform: scale(0.9) translateY(8px);
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition:
          transform 0.26s var(--ease),
          opacity 0.2s,
          visibility 0s linear 0.26s;
        overflow: hidden;
      }
      body.menu-open #sheet {
        pointer-events: auto;
        transform: none;
        opacity: 1;
        visibility: visible;
        transition:
          transform 0.26s var(--ease),
          opacity 0.2s,
          visibility 0s;
      }
      @media (max-height: 520px) and (min-width: 560px) {
        #sheet {
          bottom: calc(var(--gap) + var(--sab));
          right: calc(var(--gap) + var(--sar) + var(--fab) + 12px);
          max-height: calc(100% - var(--sat) - var(--sab) - 2 * var(--gap));
          transform-origin: calc(100% + 40px) calc(100% - 28px);
        }
      }
      .sheet-scroll {
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior: contain;
        touch-action: pan-y;
        padding: 14px 14px 6px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .section-title {
        font-size: 11px;
        font-weight: 650;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 0 2px -6px;
      }

      #tools {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 6px;
      }
      .tool {
        min-height: 56px;
        border-radius: 14px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        font-size: 11px;
        color: var(--muted);
        background: rgba(255, 255, 255, 0.05);
        transition:
          background 0.15s,
          color 0.15s,
          transform 0.15s var(--ease);
      }
      .tool:active {
        transform: scale(0.95);
      }
      .tool.on {
        background: var(--accent);
        color: var(--accent-ink);
      }

      .brush {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 44px;
        padding: 0 4px;
      }
      .brush label {
        color: var(--muted);
        font-size: 13px;
      }
      .brush output {
        min-width: 2ch;
        text-align: right;
        font-variant-numeric: tabular-nums;
        font-weight: 650;
      }
      input[type="range"] {
        flex: 1;
        min-width: 0;
        height: 44px;
        background: transparent;
        -webkit-appearance: none;
        appearance: none;
        touch-action: pan-x;
      }
      input[type="range"]::-webkit-slider-runnable-track {
        height: 6px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.14);
      }
      input[type="range"]::-moz-range-track {
        height: 6px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.14);
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 24px;
        height: 24px;
        margin-top: -9px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
      }
      input[type="range"]::-moz-range-thumb {
        width: 24px;
        height: 24px;
        border: 0;
        border-radius: 50%;
        background: var(--accent);
      }

      #materials {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(64px, 1fr));
        gap: 6px;
      }
      .mat {
        min-height: 66px;
        padding: 8px 4px 6px;
        border-radius: 14px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        background: rgba(255, 255, 255, 0.04);
        box-shadow: inset 0 0 0 1.5px transparent;
        transition:
          background 0.15s,
          box-shadow 0.15s,
          transform 0.15s var(--ease),
          opacity 0.15s;
      }
      .mat:active {
        transform: scale(0.95);
      }
      .mat .sw {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: var(--swatch);
        box-shadow:
          inset 0 0 0 1px rgba(255, 255, 255, 0.2),
          inset 0 -3px 6px rgba(0, 0, 0, 0.25);
      }
      .mat .nm {
        max-width: 100%;
        font-size: 11px;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .mat.on {
        background: rgba(255, 201, 77, 0.12);
        box-shadow: inset 0 0 0 1.5px var(--accent);
      }
      .mat.on .nm {
        color: var(--text);
      }
      .mat:disabled {
        opacity: 0.28;
        cursor: default;
      }

      .actions {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
        padding: 10px 14px 14px;
        border-top: 1px solid var(--line);
      }
      .act {
        min-height: 52px;
        border-radius: 14px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        font-size: 11px;
        color: var(--muted);
        background: rgba(255, 255, 255, 0.05);
        transition:
          background 0.15s,
          color 0.15s,
          transform 0.15s var(--ease);
      }
      .act:active {
        transform: scale(0.95);
      }
      .act.on {
        color: var(--accent);
        background: rgba(255, 201, 77, 0.12);
      }
      #act-clear {
        color: var(--danger);
      }
      #act-pause .i-play {
        display: none;
      }
      #act-pause.on .i-play {
        display: block;
      }
      #act-pause.on .i-pause {
        display: none;
      }

      /* Toast + first-run hint: one small pill, top center. */
      .pill {
        position: fixed;
        left: 50%;
        top: calc(14px + var(--sat));
        padding: 8px 14px;
        border-radius: 999px;
        font-size: 13px;
        font-weight: 600;
        pointer-events: none;
        z-index: 15;
        opacity: 0;
        transform: translate(-50%, -6px);
        transition:
          opacity 0.25s,
          transform 0.25s var(--ease);
        white-space: nowrap;
      }
      .pill.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      #hint {
        top: auto;
        bottom: calc(var(--gap) + var(--sab) + var(--fab) + 18px);
        color: var(--muted);
        font-weight: 500;
      }

      /* Share sheet. */
      #share {
        position: fixed;
        z-index: 40;
        left: 50%;
        top: 50%;
        width: min(340px, calc(100% - 32px));
        padding: 18px;
        border-radius: 22px;
        background: var(--glass-strong);
        display: flex;
        flex-direction: column;
        gap: 8px;
        transform: translate(-50%, -50%) scale(0.94);
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition:
          transform 0.22s var(--ease),
          opacity 0.2s,
          visibility 0s linear 0.22s;
      }
      body.share-open #share {
        pointer-events: auto;
        transform: translate(-50%, -50%);
        opacity: 1;
        visibility: visible;
        transition:
          transform 0.22s var(--ease),
          opacity 0.2s,
          visibility 0s;
      }
      #share-scrim {
        position: fixed;
        inset: 0;
        z-index: 35;
        background: rgba(5, 7, 14, 0.5);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s;
      }
      body.share-open #share-scrim {
        opacity: 1;
        pointer-events: auto;
      }
      #share h2 {
        font-size: 16px;
        font-weight: 650;
        margin: 0 2px 6px;
      }
      .share-action {
        min-height: 48px;
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 600;
        text-decoration: none;
        color: var(--text);
        background: rgba(255, 255, 255, 0.07);
      }
      .share-action.primary {
        background: var(--accent);
        color: var(--accent-ink);
      }
      .share-action[hidden] {
        display: none;
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          transition-duration: 0s !important;
        }
      }
    </style>
    <script>
      // Safe-area insets from the Partii app (same as the SDK's onSafeArea, platform/sdk/ts/src/safearea.ts):
      // ?safe=T,R,B,L at load, then {t: "partii:insets", top, right, bottom, left} messages from the
      // framing app on load / resize / rotation. Sets --partii-safe-* on <html>; outside the app
      // neither comes and the CSS falls back to env().
      (function () {
        var root = document.documentElement;
        function num(v) {
          return typeof v === "number" && isFinite(v) && v >= 0 ? v : 0;
        }
        function apply(t, r, b, l) {
          root.style.setProperty("--partii-safe-top", t + "px");
          root.style.setProperty("--partii-safe-right", r + "px");
          root.style.setProperty("--partii-safe-bottom", b + "px");
          root.style.setProperty("--partii-safe-left", l + "px");
        }
        try {
          var v = new URLSearchParams(location.search).get("safe");
          var p = v ? v.split(",").map(Number) : null;
          if (p && p.length === 4 && p.every(function (n) { return isFinite(n) && n >= 0; })) {
            apply(p[0], p[1], p[2], p[3]);
          }
        } catch (e) {}
        addEventListener("message", function (e) {
          var d = e.data;
          if (window.parent === window || e.source !== window.parent || !d || d.t !== "partii:insets") return;
          apply(num(d.top), num(d.right), num(d.bottom), num(d.left));
        });
      })();
    </script>
  </head>
  <body>
    <canvas id="sandii" aria-label="Sandbox"></canvas>

    <div id="hud" class="glass" hidden><span id="stats"></span></div>
    <div id="toast" class="pill glass" role="status" aria-live="polite"></div>
    <div id="hint" class="pill glass">Drag to pour</div>

    <!-- SVG icons, referenced with <use>. -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <symbol id="i-paint" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18.4 2.6a2 2 0 0 1 2.9 2.9L11 15.8 8.2 13Z"/><path d="M7 14.5c-1.6 0-3 1.3-3 3 0 1.3-1 2-2 2.5 1 .7 2.4 1 3.5 1a3.5 3.5 0 0 0 3.5-3.5"/></symbol>
        <symbol id="i-erase" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 21-4.3-4.3a1 1 0 0 1 0-1.4l10-10a1 1 0 0 1 1.4 0l5.6 5.6a1 1 0 0 1 0 1.4L11 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></symbol>
        <symbol id="i-rigid" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.7l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.7l7 4a2 2 0 0 0 2 0l7-4a2 2 0 0 0 1-1.7Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></symbol>
        <symbol id="i-blast" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 2 6 6-3-3 6 6 2-6 2 3 6-6-3-2 6-2-6-6 3 3-6-6-2 6-2-3-6 6 3Z"/></symbol>
        <symbol id="i-heat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.4-.5-2-1-3-1.1-2.1-.2-4 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.2.4-2.3 1-3.4.3 1.6 1.3 2.9 2.5 2.9Z"/></symbol>
        <symbol id="i-cool" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M2 12h20M4.9 4.9l14.2 14.2M19.1 4.9 4.9 19.1"/><path d="m9 4 3 3 3-3M9 20l3-3 3 3M4 9l3 3-3 3M20 9l-3 3 3 3"/></symbol>
        <symbol id="i-pause" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4.5" width="4" height="15" rx="1.2"/><rect x="14" y="4.5" width="4" height="15" rx="1.2"/></symbol>
        <symbol id="i-play" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.6v14.8a1 1 0 0 0 1.5.9l12-7.4a1 1 0 0 0 0-1.8l-12-7.4A1 1 0 0 0 7 4.6Z"/></symbol>
        <symbol id="i-clear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></symbol>
        <symbol id="i-camera" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7.5 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3.5Z"/><circle cx="12" cy="13" r="3.5"/></symbol>
        <symbol id="i-debug" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 5-6"/></symbol>
      </defs>
    </svg>

    <div id="quick" class="glass">
      <button type="button" id="quick-tool" class="qbtn" data-tool="paint" aria-label="Tool">
        <svg class="ico i-paint"><use href="#i-paint" /></svg>
        <svg class="ico i-erase"><use href="#i-erase" /></svg>
        <svg class="ico i-rigid"><use href="#i-rigid" /></svg>
        <svg class="ico i-blast"><use href="#i-blast" /></svg>
        <svg class="ico i-heat"><use href="#i-heat" /></svg>
        <svg class="ico i-cool"><use href="#i-cool" /></svg>
      </button>
      <span class="sep" aria-hidden="true"></span>
      <button type="button" class="qbtn qmat"></button>
      <button type="button" class="qbtn qmat"></button>
      <button type="button" class="qbtn qmat"></button>
      <button type="button" class="qbtn qmat"></button>
    </div>

    <div id="scrim"></div>
    <div id="sheet" class="glass" role="dialog" aria-modal="true" aria-label="Menu">
      <div class="sheet-scroll">
        <div id="tools" role="group" aria-label="Tools">
          <button type="button" class="tool" data-tool="paint"><svg class="ico"><use href="#i-paint" /></svg>Paint</button>
          <button type="button" class="tool" data-tool="erase"><svg class="ico"><use href="#i-erase" /></svg>Erase</button>
          <button type="button" class="tool" data-tool="rigid"><svg class="ico"><use href="#i-rigid" /></svg>Rigid</button>
          <button type="button" class="tool" data-tool="blast"><svg class="ico"><use href="#i-blast" /></svg>Blast</button>
          <button type="button" class="tool" data-tool="heat"><svg class="ico"><use href="#i-heat" /></svg>Heat</button>
          <button type="button" class="tool" data-tool="cool"><svg class="ico"><use href="#i-cool" /></svg>Cool</button>
        </div>
        <div class="brush">
          <label for="brush-slider">Brush</label>
          <input type="range" id="brush-slider" min="1" max="32" value="4" step="1" />
          <output id="brush-value" for="brush-slider">4</output>
        </div>
        <div class="section-title">Materials</div>
        <div id="materials"></div>
      </div>
      <div class="actions">
        <button type="button" class="act" id="act-pause" aria-pressed="false">
          <svg class="ico i-pause"><use href="#i-pause" /></svg>
          <svg class="ico i-play"><use href="#i-play" /></svg>
          <span class="label">Pause</span>
        </button>
        <button type="button" class="act" id="act-clear"><svg class="ico"><use href="#i-clear" /></svg>Clear</button>
        <button type="button" class="act" id="act-share"><svg class="ico"><use href="#i-camera" /></svg>Snapshot</button>
        <button type="button" class="act" id="act-debug" aria-pressed="false"><svg class="ico"><use href="#i-debug" /></svg>Stats</button>
      </div>
    </div>

    <button type="button" id="menu-btn" class="glass" aria-label="Menu" aria-expanded="false" aria-controls="sheet">
      <span class="bars"></span>
    </button>

    <div id="share-scrim"></div>
    <div id="share" class="glass" role="dialog" aria-modal="true" aria-labelledby="share-title">
      <h2 id="share-title">Snapshot</h2>
      <button type="button" class="share-action primary" id="share-save">Save image</button>
      <button type="button" class="share-action" id="share-native" hidden>Share image</button>
      <a class="share-action" id="share-x" href="#" target="_blank" rel="noopener noreferrer">Post on X</a>
      <button type="button" class="share-action" id="share-close">Done</button>
    </div>

    <script>
      (function () {
        var body = document.body;
        var canvas = document.getElementById("sandii");
        var menuBtn = document.getElementById("menu-btn");

        // --- Menu ---
        function setMenu(open) {
          body.classList.toggle("menu-open", open);
          menuBtn.setAttribute("aria-expanded", open ? "true" : "false");
          if (!open && document.activeElement && document.activeElement.blur) document.activeElement.blur();
        }
        menuBtn.addEventListener("click", function () {
          setMenu(!body.classList.contains("menu-open"));
        });
        document.getElementById("scrim").addEventListener("pointerdown", function (e) {
          e.preventDefault();
          setMenu(false);
        });
        // Picking a material or tool means "go paint": close the menu.
        document.getElementById("sheet").addEventListener("click", function (e) {
          var b = e.target.closest(".mat, .tool, #act-clear");
          if (b && !b.disabled) setTimeout(function () { setMenu(false); }, 60);
        });

        // --- Toast (also called from Rust: window.sandiiToast) ---
        var toastEl = document.getElementById("toast");
        var toastTimer = 0;
        window.sandiiToast = function (text) {
          toastEl.textContent = text;
          toastEl.classList.add("show");
          clearTimeout(toastTimer);
          toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 1100);
        };

        // --- One-time hint ---
        var hint = document.getElementById("hint");
        var hintKey = "sandii_hint_v2";
        var seen = false;
        try { seen = localStorage.getItem(hintKey) === "1"; } catch (e) {}
        function hideHint() {
          hint.classList.remove("show");
          try { localStorage.setItem(hintKey, "1"); } catch (e) {}
        }
        if (!seen) {
          setTimeout(function () { hint.classList.add("show"); }, 500);
          setTimeout(hideHint, 4000);
          canvas.addEventListener("pointerdown", hideHint, { once: true });
        }

        // --- No pinch / double-tap zoom anywhere (iOS ignores user-scalable=no) ---
        ["gesturestart", "gesturechange", "gestureend"].forEach(function (t) {
          document.addEventListener(t, function (e) { e.preventDefault(); }, { passive: false });
        });
        document.addEventListener(
          "touchmove",
          function (e) {
            if (e.touches.length > 1 || !e.target.closest(".sheet-scroll")) e.preventDefault();
          },
          { passive: false },
        );

        // --- Snapshot ---
        var shareNative = document.getElementById("share-native");
        function setShare(open) {
          body.classList.toggle("share-open", open);
          if (open) {
            var url = location.href;
            document.getElementById("share-x").href =
              "https://twitter.com/intent/tweet?" +
              new URLSearchParams({ text: "Made this in Sandii", url: url }).toString();
            shareNative.hidden = typeof navigator.share !== "function";
          }
        }
        document.getElementById("act-share").addEventListener("click", function () {
          setMenu(false);
          setShare(true);
        });
        document.getElementById("share-close").addEventListener("click", function () { setShare(false); });
        document.getElementById("share-scrim").addEventListener("click", function () { setShare(false); });
        document.getElementById("share-save").addEventListener("click", function () {
          try {
            var a = document.createElement("a");
            a.download = "sandii-" + new Date().toISOString().replace(/[:.]/g, "-").slice(0, 19) + ".png";
            a.href = canvas.toDataURL("image/png");
            a.click();
            window.sandiiToast("Saved");
          } catch (err) {
            console.error(err);
          }
        });
        shareNative.addEventListener("click", function () {
          canvas.toBlob(function (blob) {
            if (!blob) return;
            var file = new File([blob], "sandii.png", { type: "image/png" });
            var data =
              navigator.canShare && navigator.canShare({ files: [file] })
                ? { files: [file], title: "Sandii" }
                : { title: "Sandii", url: location.href };
            var p = navigator.share(data);
            if (p && p.catch) p.catch(function () {});
          }, "image/png");
        });

        // --- Keys: Esc closes, M / Tab toggles the menu ---
        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape") {
            setShare(false);
            setMenu(false);
          } else if ((e.key === "m" || e.key === "M") && !e.metaKey && !e.ctrlKey) {
            setMenu(!body.classList.contains("menu-open"));
          }
        });
      })();
    </script>
  </body>
</html>
