[package]
name = "sandii_web"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
console_error_panic_hook = "0.1"
falling_everything_core = { path = "../falling_everything_core", default-features = false }
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "CanvasRenderingContext2d",
    "console",
    "CssStyleDeclaration",
    "Document",
    "DomRect",
    "Element",
    "Event",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlInputElement",
    "ImageData",
    "KeyboardEvent",
    "MouseEvent",
    "Performance",
    "Window",
] }
